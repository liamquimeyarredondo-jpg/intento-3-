<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>Experiencia WebAR</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Versiones alineadas con el ejemplo de instalación oficial de MindAR. -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
  <main id="ar-app">
    <a-scene
      id="ar-scene"
      mindar-image="imageTargetSrc: ./targets/poster.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no"
      embedded
      color-space="sRGB"
      renderer="alpha: true; antialias: true; colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">
      <a-camera
        id="ar-camera"
        position="0 0 0"
        look-controls="enabled: false"
        cursor="fuse: false; rayOrigin: mouse"
        raycaster="objects: .tap-target; near: 0; far: 10000">
      </a-camera>

      <a-entity id="poster-target" mindar-image-target="targetIndex: 0">
        <!-- Plano casi invisible que recibe el toque en cualquier punto del afiche. -->
        <a-plane
          id="tap-target"
          class="tap-target"
          position="0 0 0.025"
          width="1"
          height="1.414"
          material="shader: flat; color: #000000; transparent: true; opacity: 0.001; side: double; depthWrite: false">
        </a-plane>
        <a-entity id="art-node" visible="false"></a-entity>
        <a-entity id="text-node" visible="false"></a-entity>
      </a-entity>
    </a-scene>

    <div id="camera-hint" class="camera-hint" aria-live="polite">Preparando la experiencia…</div>
    <button id="restart-button" class="restart-button" type="button" hidden>Volver al inicio</button>
    <div id="setup-notice" class="setup-notice" role="status" hidden></div>
    <div class="rotate-notice" aria-hidden="true">Para una mejor experiencia, girá el celular a vertical.</div>
  </main>
  <script src="app.js"></script>
</body>
</html>
